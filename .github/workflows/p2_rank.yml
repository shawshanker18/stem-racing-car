name: p2_rank
run-name: "Part 2: ranking check, 20 cars on the ${{ inputs.res }} mesh (${{ inputs.label }})"

# Step 3: the same 20 stress cars (12 lofted, 8 carved) on one mesh recipe.
# Run once with the search mesh and once with the fine mesh; rank_study.py
# stats compares the two orders.
on:
  workflow_dispatch:
    inputs:
      label: { required: true }
      res: { default: "fine" }
      iters: { default: "1000" }
      opt: { default: "{}" }
      cars: { default: '["L0","L1","L2","L3","L4","L5","L6","L7","L8","L9","L10","L11","C0","C1","C2","C3","C4","C5","C6","C7"]' }

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1

jobs:
  car:
    name: ${{ inputs.label }} ${{ matrix.car }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        car: ${{ fromJSON(inputs.cars) }}
    env:
      OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: |
          set -o pipefail
          python -W ignore ../part2-simulation/rank_study.py car ${{ matrix.car }} --res ${{ inputs.res }} \
            --iters ${{ inputs.iters }} --cfd-json '${{ inputs.opt }}' --out ../out/${{ matrix.car }} 2>&1 | tail -15
      - name: The numbers
        if: always()
        run: |
          set -o pipefail
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          c = json.load(open("out/${{ matrix.car }}/summary.json"))["cfd_initial"]
          print("RANKCAR ${{ inputs.label }} ${{ matrix.car }}", json.dumps({k: c[k] for k in
                ("D20_N", "T_at_target_s", "T_raw_s", "converged", "drift", "stderr", "seconds")}))
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-${{ inputs.label }}-${{ matrix.car }}
          path: out/${{ matrix.car }}/summary.json
